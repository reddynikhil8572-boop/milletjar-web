services:
  - type: web
    name: milletjar-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Public origin, e.g. https://www.milletjar.in
      - key: APP_URL
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        sync: false
      - key: NEXT_PUBLIC_CONTACT_EMAIL
        sync: false
      # Google Search Console HTML-tag verification token (public, not a secret)
      - key: NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
        sync: false
      # Render terminates TLS and appends the real peer to X-Forwarded-For.
      - key: TRUST_PROXY
        value: "true"
      # Customer auth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # Admin auth (separate secret; accounts live in Supabase Auth)
      - key: ADMIN_AUTH_SECRET
        generateValue: true
      # Supabase data store (users, sessions, orders, saved addresses).
      # Leave unset to fall back to the local file store.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Uncomment together with the disk block below to keep data across deploys.
      # - key: DATA_DIR
      #   value: /var/data
    # Persistent disk: requires a paid instance type.
    # disk:
    #   name: milletjar-data
    #   mountPath: /var/data
    #   sizeGB: 1
